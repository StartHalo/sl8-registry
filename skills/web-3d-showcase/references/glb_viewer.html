<!doctype html>
<!-- web-3d-showcase GLB viewer (SL8-authored). One model on a flat mid-grey ground, framed by its
     bounding box. Query: ?src=models/<id>.glb[&yaw=0][&meshopt=1]. Needs vendor/three/ beside it
     (SKILL.md step 7). Exposes window.__viewer = { ready, setYaw(deg), stats } for render_check.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLB viewer</title>
<style>html,body{margin:0;height:100%;background:#808080}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

const q = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x808080)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2.2))
const sun = new THREE.DirectionalLight(0xffffff, 2.0); sun.position.set(2, 4, 3); scene.add(sun)
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 1000)
const pivot = new THREE.Group(); scene.add(pivot)
const draw = () => renderer.render(scene, camera)

const loader = new GLTFLoader()
let meshoptReady = Promise.resolve()
if (q.get('meshopt') === '1') {
  meshoptReady = import('three/addons/libs/meshopt_decoder.module.js').then(async ({ MeshoptDecoder }) => { await MeshoptDecoder.ready; loader.setMeshoptDecoder(MeshoptDecoder) })
}

const stats = {}
const ready = meshoptReady.then(() => loader.loadAsync(q.get('src'))).then((gltf) => {
  const root = gltf.scene
  const box = new THREE.Box3().setFromObject(root)
  const size = box.getSize(new THREE.Vector3()); const centre = box.getCenter(new THREE.Vector3())
  root.position.sub(centre); pivot.add(root)
  const r = Math.max(size.x, size.y, size.z) || 1
  camera.position.set(0, size.y * 0.1, r * 2.2); camera.lookAt(0, 0, 0)
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix()
  let meshes = 0, triangles = 0, skinned = 0; const materials = new Set(); const textures = new Set(); let mMin = 1, mMax = 0
  root.traverse((o) => {
    if (!o.isMesh) return
    meshes++; if (o.isSkinnedMesh) skinned++
    const g = o.geometry; triangles += (g.index ? g.index.count : g.attributes.position.count) / 3
    for (const m of [].concat(o.material)) { materials.add(m.uuid); if (typeof m.metalness === 'number') { mMin = Math.min(mMin, m.metalness); mMax = Math.max(mMax, m.metalness) }; for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) if (m[k]) textures.add(m[k].uuid) }
  })
  Object.assign(stats, { meshes, triangles: Math.round(triangles), skinned, materials: materials.size, textures: textures.size, animations: gltf.animations.length, metalness: [Number(mMin.toFixed(2)), Number(mMax.toFixed(2))], bbox: [size.x, size.y, size.z].map((v) => Number(v.toFixed(3))) })
  draw()
})
window.__viewer = {
  ready,
  stats,
  setYaw: async (deg) => { await ready; pivot.rotation.y = THREE.MathUtils.degToRad(deg); draw() }
}
ready.then(() => window.__viewer.setYaw(Number(q.get('yaw') || 0)))
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); draw() })
</script>
</body>
</html>
